name: "Helm Chart Testing"
description: "Install the Helm chart-testing tool"
author: "step-security"
branding:
  color: blue
  icon: anchor
inputs:
  verify_blob:
    description: "determines whether the download blob should be verified (default: true)"
    required: false
    default: 'true'
  version:
    description: "The chart-testing version to install"
    required: false
    default: '3.15.0'
  yamllint_version:
    description: "The yamllint version to install"
    required: false
    default: '1.33.0'
  yamale_version:
    description: "The yamale version to install"
    required: false
    default: '6.0.0'
  uv_version:
    description: "The uv version to install (default: latest)"
    required: false
    default: 'latest'
  github_token:
    description: "GitHub token for authenticating with the GitHub API (default: github.token)"
    required: false
    default: ${{ github.token }}
  lint_config:
    description: "Path to a custom yamllint config file. If set, ct lint uses it instead of the default lintconf.yaml."
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Subscription check
      env:
        REPO_PRIVATE: ${{ github.event.repository.private }}
      run: |
        # validate subscription status
        UPSTREAM="helm/chart-testing-action"
        ACTION_REPO="${GITHUB_ACTION_REPOSITORY:-}"
        DOCS_URL="https://docs.stepsecurity.io/actions/stepsecurity-maintained-actions"

        echo ""
        echo -e "\033[1;36mStepSecurity Maintained Action\033[0m"
        echo "Secure drop-in replacement for $UPSTREAM"
        if [ "$REPO_PRIVATE" = "false" ]; then
          echo -e "\033[32m✓ Free for public repositories\033[0m"
        fi
        echo -e "\033[36mLearn more:\033[0m $DOCS_URL"
        echo ""

        if [ "$REPO_PRIVATE" != "false" ]; then
          SERVER_URL="${GITHUB_SERVER_URL:-https://github.com}"

          if [ "$SERVER_URL" != "https://github.com" ]; then
            BODY=$(printf '{"action":"%s","ghes_server":"%s"}' "$ACTION_REPO" "$SERVER_URL")
          else
            BODY=$(printf '{"action":"%s"}' "$ACTION_REPO")
          fi

          API_URL="https://agent.api.stepsecurity.io/v1/github/$GITHUB_REPOSITORY/actions/maintained-actions-subscription"

          RESPONSE=$(curl --max-time 3 -s -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "$API_URL" -o /dev/null) && CURL_EXIT_CODE=0 || CURL_EXIT_CODE=$?

          if [ $CURL_EXIT_CODE -ne 0 ]; then
            echo "Timeout or API not reachable. Continuing to next step."
          elif [ "$RESPONSE" = "403" ]; then
            echo -e "::error::\033[1;31mThis action requires a StepSecurity subscription for private repositories.\033[0m"
            echo -e "::error::\033[31mLearn how to enable a subscription: $DOCS_URL\033[0m"
            exit 1
          fi
        fi
      shell: bash
    - uses: step-security/cosign-installer@7d5ca7d0ecba292387fa6f81cde2c05e53a2a6d7 # v4.1.2
      if: ${{ inputs.verify_blob != 'false' }}
    - uses: step-security/setup-uv@74a4e3db95d70115a82e33151924944cfac643cb # v10.2.0
      with:
        version: ${{ inputs.uv_version }}
        github-token: ${{ inputs.github_token }}
    - run: |
        cd "$GITHUB_ACTION_PATH" \
        && ./ct.sh \
            --verify-blob "$VERIFY_BLOB" \
            --version "$CHART_TESTING_VERSION" \
            --yamllint-version "$YAMLLINT_VERSION" \
            --yamale-version "$YAMALE_VERSION"
      shell: bash
      env:
        VERIFY_BLOB: ${{ inputs.verify_blob }}
        CHART_TESTING_VERSION: ${{ inputs.version }}
        YAMLLINT_VERSION: ${{ inputs.yamllint_version }}
        YAMALE_VERSION: ${{ inputs.yamale_version }}
    - if: inputs.lint_config != ''
      env:
        LINT_CONFIG: ${{ inputs.lint_config }}
      run: |
        if [[ "${LINT_CONFIG}" == *[$'\n\r']* ]]; then
          echo "::error::lint_config must not contain a line break"
          exit 1
        fi
        if [[ ! -f "${LINT_CONFIG}" ]]; then
          echo "::error::lint_config file not found: ${LINT_CONFIG}"
          exit 1
        fi
        lint_conf="$(realpath -- "${LINT_CONFIG}")"
        if [[ "${lint_conf}" == *[$'\n\r']* ]]; then
          echo "::error::lint_config must not resolve to a path with a line break"
          exit 1
        fi
        echo "CT_LINT_CONF=${lint_conf}" >> "${GITHUB_ENV}"
        echo "Using custom yamllint config: ${LINT_CONFIG}"
      shell: bash
